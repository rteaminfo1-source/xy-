<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rteam.info | Авторизация</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(22, 28, 45, 0.6);
            --border-color: rgba(0, 242, 254, 0.2);
            --text-color: #f0f4f8;
            --accent-cyan: #00f2fe;
            --accent-magenta: #4facfe;
            --blur-effect: blur(16px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            background-image: radial-gradient(circle at 50% 30%, #1e2640 0%, #0b0f19 80%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            background: var(--panel-bg);
            backdrop-filter: var(--blur-effect);
            -webkit-backdrop-filter: var(--blur-effect);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 242, 254, 0.05);
            position: relative;
            overflow: hidden;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta));
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            color: #fff;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
            background: rgba(0, 0, 0, 0.6);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(45deg, rgba(0, 242, 254, 0.2), rgba(79, 172, 254, 0.2));
            color: #fff;
            border: 1px solid var(--accent-cyan);
            padding: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-magenta));
            color: #0b0f19;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            border-color: transparent;
        }

        .switch-mode {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #a0aec0;
        }

        .switch-link {
            color: var(--accent-cyan);
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
            margin-left: 5px;
        }

        .switch-link:hover {
            color: var(--accent-magenta);
            text-decoration: underline;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #718096;
            text-decoration: none;
        }

        .back-link:hover { color: #fff; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo">Rteam.info</div>
        <div class="subtitle" id="authSubtitle">Вход в панель обсуждений</div>

        <div id="authForm">
            <div class="form-group">
                <label for="authLogin">Логин</label>
                <input type="text" id="authLogin" placeholder="Введите ваш никнейм" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="authPassword">Пароль</label>
                <input type="password" id="authPassword" placeholder="Введите пароль">
            </div>

            <div id="regFields" class="hidden">
                <div class="form-group">
                    <label for="authPasswordConfirm">Подтверждение пароля</label>
                    <input type="password" id="authPasswordConfirm" placeholder="Повторите пароль">
                </div>
            </div>

            <button class="btn-submit" id="submitBtn" onclick="processAuth()">Войти</button>
        </div>

        <div class="switch-mode">
            <span id="switchText">Ещё нет аккаунта?</span>
            <span class="switch-link" id="switchBtn" onclick="toggleMode()">Зарегистрироваться</span>
        </div>

        <a href="forum.html" class="back-link">← Вернуться на форум гостем</a>
    </div>

    <script>
        const SERVER_URL = 'server1.php';
        let DB = { users: [], posts: [] };
        let isRegisterMode = false;

        async function loadDB() {
            try {
                let response = await fetch(SERVER_URL);
                DB = await response.json();
            } catch (e) {
                console.error("Ошибка синхронизации: ", e);
            }
        }

        window.onload = loadDB;

        function toggleMode() {
            isRegisterMode = !isRegisterMode;
            const subtitle = document.getElementById('authSubtitle');
            const regFields = document.getElementById('regFields');
            const submitBtn = document.getElementById('submitBtn');
            const switchText = document.getElementById('switchText');
            const switchBtn = document.getElementById('switchBtn');

            document.getElementById('authLogin').value = "";
            document.getElementById('authPassword').value = "";
            document.getElementById('authPasswordConfirm').value = "";

            if (isRegisterMode) {
                subtitle.innerText = "Регистрация нового аккаунта";
                regFields.classList.remove('hidden');
                submitBtn.innerText = "Создать аккаунт";
                switchText.innerText = "Уже зарегистрированы?";
                switchBtn.innerText = "Войти";
            } else {
                subtitle.innerText = "Вход в панель обсуждений";
                regFields.classList.add('hidden');
                submitBtn.innerText = "Войти";
                switchText.innerText = "Ещё нет аккаунта?";
                switchBtn.innerText = "Зарегистрироваться";
            }
        }

        async function processAuth() {
            const login = document.getElementById('authLogin').value.trim();
            const pass = document.getElementById('authPassword').value.trim();

            if (!login || !pass) {
                alert("Пожалуйста, заполните все поля!");
                return;
            }

            if (isRegisterMode) {
                const passConfirm = document.getElementById('authPasswordConfirm').value;
                if (pass !== passConfirm) {
                    alert("Введенные пароли не совпадают!");
                    return;
                }
                const userExists = DB.users.find(u => u.username.toLowerCase() === login.toLowerCase());
                if (userExists) {
                    alert("Пользователь с таким логином уже существует!");
                    return;
                }

                let newUser = { username: login, password: pass, role: "user" };
                DB.users.push(newUser);

                try {
                    await fetch(SERVER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(DB)
                    });
                    localStorage.setItem('rteam_logged_user', JSON.stringify(newUser));
                    alert("Регистрация успешна!");
                    window.location.href = 'forum.html';
                } catch (e) {
                    alert("Ошибка сохранения на сервере.");
                }
            } else {
                const foundUser = DB.users.find(u => u.username.toLowerCase() === login.toLowerCase() && u.password === pass);
                if (!foundUser) {
                    alert("Неверный логин или пароль!");
                    return;
                }
                localStorage.setItem('rteam_logged_user', JSON.stringify(foundUser));
                window.location.href = 'forum.html';
            }
        }
    </script>
</body>
</html>
