org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Fabric toolchain (one Loom version builds every Minecraft version)
loom_version=1.19-SNAPSHOT
loader_version=0.20.1

# Mod
mod_id=rteamvisuals
mod_name=RTeam Visuals
mod_version=1.0.0
maven_group=dev.rteam

# Fabric's maven can be slow: longer timeouts and retries for downloads
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=2000
