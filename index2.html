<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт в разработке</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Декоративные светящиеся круги на фоне */
        body::before, body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.15;
        }

        body::before {
            width: 300px;
            height: 300px;
            background: #3b82f6;
            top: 15%;
            left: 20%;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: #a855f7;
            bottom: 15%;
            right: 20%;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
        }

        .icon {
            font-size: 36px;
            animation: pulse 2s infinite ease-in-out;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 16px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .contacts {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 24px;
        }

        .contacts-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-bottom: 12px;
        }

        .email-link {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .email-link:hover {
            color: #60a5fa;
            text-decoration: underline;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 26px;
            }
            p {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">
            <!-- Эмодзи можно заменить на SVG-иконку или логотип -->
            <span class="icon">🚀</span> 
        </div>
        <h1>Сайт в разработке</h1>
        <p>Мы усердно работаем над созданием чего-то потрясающего. Наш новый веб-сайт запустится совсем скоро. Заглядывайте позже!На Основной сайт rteam.info</p>
        
        <div class="contacts">
            <div class="contacts-title">Для связи</div>
            <a href="mailto:Rteam.info1@gamil.com" class="email-link">Rteam.info1@gmail.com</a>
        </div>
    </div>

</body>
</html>
